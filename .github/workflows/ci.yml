name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f ./server/Dockerfile \
            -t ecommerce-backend:test \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            -f ./client/Dockerfile \
            -t ecommerce-frontend:test \
            ./client

#======================================================
#Push to ECR
#======================================================
  push-to-ecr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::511434341250:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image to ECR
        run: |
          docker build \
            -f ./server/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/ecommerce-backend:latest \
            ./server